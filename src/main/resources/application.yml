spring:
  application:
    name: gesper-server

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gesper}
    username: ${DB_USERNAME:gesper}
    password: ${DB_PASSWORD:gesper}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 30
        order_inserts: true
        order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id-disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-secret-disabled}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/api/v1/oauth2/callback/{registrationId}"

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
  error:
    include-message: always
    include-binding-errors: always
  compression:
    enabled: true
  forward-headers-strategy: framework

# Application-specific properties
gesper:
  mail:
    from: ${MAIL_FROM:noreply@gesper.com}
    from-name: ${MAIL_FROM_NAME:GesPer}
    admin-recipient: ${MAIL_ADMIN_RECIPIENT:admin@gesper.com}
  security:
    jwt:
      secret: ${JWT_SECRET:Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tdGhpcy1pcy1hLXNlY3JldC1rZXktZm9yLWp3dC1hdC1sZWFzdC0yNTYtYml0cw==}
      access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}      # 15 min
      refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 jours
      issuer: gesper-server
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
    oauth2:
      authorized-redirect-uris: ${OAUTH2_REDIRECT_URIS:http://localhost:3000/oauth2/redirect,http://localhost:5173/oauth2/redirect}
  rate-limit:
    enabled: true
    capacity: 10
    refill-tokens: 10
    refill-duration: 60

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.gesper: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
