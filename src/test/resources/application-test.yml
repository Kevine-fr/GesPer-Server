spring:
  datasource:
    url: jdbc:h2:mem:gesper_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 3025

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret

gesper:
  security:
    jwt:
      secret: dGVzdC1zZWNyZXQtZm9yLWp3dC10ZXN0LXNlY3JldC1hdC1sZWFzdC0yNTYtYml0cy1sb25nLWVub3VnaA==
      access-token-expiration: 900000
      refresh-token-expiration: 604800000
      issuer: gesper-test
    cors:
      allowed-origins: http://localhost:3000
    oauth2:
      authorized-redirect-uris: http://localhost:3000/oauth2/redirect
  mail:
    from: test@gesper.local
    from-name: GesPer Test
    admin-recipient: admin@gesper.local
