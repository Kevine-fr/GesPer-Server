name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Production VPS
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} bash -s << 'DEPLOY'
          set -e

          REPO_URL="git@github.com:${{ secrets.REPO_URL }}.git"

          echo "Preparation du depot..."
          mkdir -p ${{ secrets.PATH_DIR }}
          cd ${{ secrets.PATH_DIR }}

          if [ ! -d .git ]; then
            echo "Premier deploiement : initialisation du depot git..."
            git init -q
            git remote add origin "$REPO_URL" 2>/dev/null || git remote set-url origin "$REPO_URL"
          else
            git remote set-url origin "$REPO_URL"
          fi

          echo "Mise a jour du code..."
          git fetch origin --prune
          git reset --hard origin/main

          echo "Generation du .env..."

          cat > .env << 'ENVEOF'

          SPRING_PROFILES_ACTIVE=production
          SERVER_PORT=8080

          DB_URL=jdbc:postgresql://postgres:5432/${{ secrets.DB_NAME }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_PORT=5432

          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_ACCESS_EXPIRATION=900000
          JWT_REFRESH_EXPIRATION=604800000

          OAUTH2_REDIRECT_URIS=${{ secrets.OAUTH2_REDIRECT_URIS }}

          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}

          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}

          MAIL_HOST=${{ secrets.MAIL_HOST }}
          MAIL_PORT=${{ secrets.MAIL_PORT }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM=${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME=${{ secrets.MAIL_FROM_NAME }}
          MAIL_ADMIN_RECIPIENT=${{ secrets.MAIL_ADMIN_RECIPIENT }}

          ENVEOF

          echo "Demarrage des conteneurs..."
          docker compose -p gesper -f docker-compose.prod.yml up -d --build

          docker exec nginx nginx -s reload || true

          echo "Deploiement termine."
          DEPLOY

      - name: Resume
        run: |
          echo "## Production deployee" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://${{ secrets.APP_DOMAIN }} |" >> $GITHUB_STEP_SUMMARY