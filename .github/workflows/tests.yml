name: Tests

# Les épreuves sur chaque PR et chaque push sur dev : une PR ne s'annonce
# prête qu'avec cette coche verte (CLAUDE.md).
on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test
      - name: Contrat de sauvegarde
        run: bash tests/sauvegarde.test.sh
