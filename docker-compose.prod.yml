name: gesper

# Plafonds de ressources (VPS mutualise 8 vCPU / 24 Go) : voir CAPACITY.md dans
# le depot Infrastructure. La JVM de l'image utilise MaxRAMPercentage=75, elle
# dimensionne donc son tas sur mem_limit (~1,1 Go ici) et non sur les 24 Go de
# l'hote : sans ce plafond, le tas visait ~18 Go.
x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gesper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gesper}
      POSTGRES_USER: ${DB_USERNAME:-gesper}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gesper}
    expose:
      - "${DB_PORT:-5432}"
    volumes:
      - gesper-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 1
    cpu_shares: 1024
    logging: *logging
    networks:
      - web

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: gesper-server:latest
    container_name: gesper-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # « production » par défaut : le profil dev journalise chaque requête SQL
      # avec ses paramètres (TRACE), mots de passe hachés et jetons compris.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      # Nom de conteneur, unique sur la machine : sur le réseau partagé « web »,
      # un nom de service court peut désigner la base d'une autre stack.
      DB_URL: jdbc:postgresql://gesper-postgres:5432/${DB_NAME:-gesper}
      DB_USERNAME: ${DB_USERNAME:-gesper}
      DB_PASSWORD: ${DB_PASSWORD:-gesper}
      # Pas de valeur par défaut : celle d'avant était publique (dans ce dépôt),
      # et quiconque la lisait pouvait signer ses propres jetons d'admin.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@gesper.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-GesPer}
      MAIL_ADMIN_RECIPIENT: ${MAIL_ADMIN_RECIPIENT:-admin@gesper.local}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      OAUTH2_REDIRECT_URIS: ${OAUTH2_REDIRECT_URIS:-http://localhost:3000/oauth2/redirect,http://localhost:5173/oauth2/redirect}
    expose:
      - "${SERVER_PORT:-8080}"
    mem_limit: 1536m
    cpus: 2
    cpu_shares: 1024
    logging: *logging
    networks:
      - web

  # Exporteur de la base, dans la stack de l'appli : il lit les identifiants
  # du même .env que l'API. Celui du dépôt Infrastructure dépendait d'un DSN en
  # secret GitHub, vide ou faux : Grafana montrait la base « injoignable » en
  # continu alors qu'elle servait l'API.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: gesper-postgres-exporter
    restart: unless-stopped
    environment:
      # Formes séparées plutôt qu'un DSN : un mot de passe contenant @ / : ou ?
      # casserait une URL, pas ces variables.
      DATA_SOURCE_URI: gesper-postgres:5432/${DB_NAME:-gesper}?sslmode=disable
      DATA_SOURCE_USER: ${DB_USERNAME:-gesper}
      DATA_SOURCE_PASS: ${DB_PASSWORD:-gesper}
    expose:
      - "9187"
    depends_on:
      - postgres
    mem_limit: 96m
    cpus: 0.2
    cpu_shares: 256
    logging: *logging
    networks:
      - web

volumes:
  gesper-pg-data:

networks:
  web:
    external: true
    name: web
