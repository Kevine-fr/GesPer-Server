name: gesper

# Plafonds de ressources (VPS mutualise 8 vCPU / 24 Go) : voir CAPACITY.md dans
# le depot Infrastructure. La JVM de l'image utilise MaxRAMPercentage=75, elle
# dimensionne donc son tas sur mem_limit (~1,1 Go ici) et non sur les 24 Go de
# l'hote : sans ce plafond, le tas visait ~18 Go.
x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gesper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gesper}
      POSTGRES_USER: ${DB_USERNAME:-gesper}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gesper}
    expose:
      - "${DB_PORT:-5432}"
    volumes:
      - gesper-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 1
    cpu_shares: 1024
    logging: *logging
    networks:
      - web

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: gesper-server:latest
    container_name: gesper-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-gesper}
      DB_USERNAME: ${DB_USERNAME:-gesper}
      DB_PASSWORD: ${DB_PASSWORD:-gesper}
      JWT_SECRET: ${JWT_SECRET:-Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tdGhpcy1pcy1hLXNlY3JldC1rZXktZm9yLWp3dC1hdC1sZWFzdC0yNTYtYml0cw==}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@gesper.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-GesPer}
      MAIL_ADMIN_RECIPIENT: ${MAIL_ADMIN_RECIPIENT:-admin@gesper.local}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      OAUTH2_REDIRECT_URIS: ${OAUTH2_REDIRECT_URIS:-http://localhost:3000/oauth2/redirect,http://localhost:5173/oauth2/redirect}
    expose:
      - "${SERVER_PORT:-8080}"
    mem_limit: 1536m
    cpus: 2
    cpu_shares: 1024
    logging: *logging
    networks:
      - web

volumes:
  gesper-pg-data:

networks:
  web:
    external: true
    name: web
